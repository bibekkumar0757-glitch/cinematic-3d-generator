<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cinematic 3D Generator V2</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<!-- CINEMATIC 3D GENERATOR V2: single-file app, hosted on GitHub Pages. -->
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  :root {
    --bg: #06070c;
    --panel: #0e1019;
    --line: #1f2335;
    --text: #e9ebf5;
    --muted: #868ca6;
    --amber: #ffb454;
    --blue: #5b8cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, -apple-system, Roboto, sans-serif;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 16px 14px 28px; display: grid; gap: 14px; }
  h1 { margin: 4px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  /* ---- Preview window (the cinematic letterbox) ---- */
  .screen {
    position: relative; background: #000; border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden; height: 58vw; min-height: 230px; max-height: 420px;
  }
  .screen canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { position: absolute; left: 0; right: 0; height: 9%; background: #000; pointer-events: none; }
  .bar.top { top: 0; } .bar.bottom { bottom: 0; }
  .hud {
    position: absolute; left: 12px; right: 12px; bottom: calc(9% + 8px);
    display: flex; justify-content: space-between; font-size: 12px;
    color: rgba(255,255,255,.75); pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .rec { color: var(--amber); }
  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.78); color: var(--text); font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .overlay.on { opacity: 1; }
  .err { display: none; background: #3a1018; border: 1px solid #7a2433; color: #ffd5db;
         border-radius: 10px; padding: 12px; font-size: 14px; word-break: break-word; }

  /* ---- Panels & controls ---- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
  label { font-size: 14px; color: var(--muted); }
  textarea {
    width: 100%; min-height: 76px; resize: vertical; padding: 12px;
    background: #090a11; color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; font: inherit; font-size: 16px;
  }
  textarea:focus, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 13px;
  }
  .chip:active { border-color: var(--blue); }
  .primary {
    width: 100%; padding: 15px; border: 0; border-radius: 10px; cursor: pointer;
    background: var(--amber); color: #1a1205; font: inherit; font-size: 16px; font-weight: 700;
  }
  .primary:active { transform: scale(.985); }
  .row { display: flex; align-items: center; gap: 12px; }
  .play {
    flex: none; width: 96px; padding: 12px 0; border-radius: 10px; cursor: pointer;
    background: transparent; color: var(--text); border: 1px solid var(--line);
    font: inherit; font-size: 15px; font-weight: 500;
  }
  .progress { flex: 1; height: 6px; background: #1a1d2c; border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--amber); }
  input[type=range] { width: 100%; accent-color: var(--amber); height: 32px; }
  .status { font-size: 13px; color: var(--muted); min-height: 18px; }
  @media (prefers-reduced-motion: reduce) { .overlay { transition: none; } }
</style>

<div class="app">
    <div class="err" id="err"></div>
    <header>
      <h1>Cinematic 3D Generator</h1>
      <p class="sub">Version 2. Describe any scene in your own words, then press Generate Scene.</p>
    </header>

    <div class="screen" id="screen">
      <canvas id="canvas"></canvas>
      <div class="bar top"></div>
      <div class="bar bottom"></div>
      <div class="hud"><span class="rec" id="sceneName">EARTH</span><span id="timecode">00:00 / 00:20</span></div>
      <div class="overlay" id="overlay">Composing scene…</div>
    </div>

    <div class="panel">
      <div class="row">
        <button class="play" id="playBtn">Pause</button>
        <div class="progress"><div id="progressFill"></div></div>
      </div>
      <div>
        <label for="duration">Animation duration: <b id="durationLabel">20 s</b></label>
        <input type="range" id="duration" min="5" max="60" step="1" value="20">
      </div>
    </div>

    <div class="panel">
      <label for="prompt">Scene prompt</label>
      <textarea id="prompt" placeholder="Describe anything: a medieval castle at sunset, a T-Rex in a misty valley...">A realistic rotating Earth with clouds floating in deep space</textarea>
      <div class="chips" id="chips">
        <button class="chip">Rotating Earth</button>
        <button class="chip">Castle at sunset</button>
        <button class="chip">Misty jungle</button>
        <button class="chip">Underwater coral reef</button>
        <button class="chip">T-Rex in a prehistoric valley</button>
        <button class="chip">Neon city at night</button>
        <button class="chip">Snowy mountains</button>
        <button class="chip">Erupting volcano</button>
        <button class="chip">Wolves in a meadow</button>
        <button class="chip">Glowing blue abstract energy</button>
      </div>
      <button class="primary" id="generateBtn">Generate Scene</button>
      <div class="status" id="status">Type any scene, or tap an example. Drag the preview to look around.</div>
    </div>
  </div>

<!-- Three.js from a CDN (no install needed) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* =====================================================================
   CINEMATIC 3D GENERATOR  -  VERSION 1
   Sections:
   1. Settings & scene library
   2. Prompt reader (turns your words into a scene)
   3. Procedural textures (used when no photo texture is available)
   4. Three.js setup (renderer, camera, lights, stars)
   5. Scene builders (planet, atmosphere, clouds, rings, sun)
   6. Animation loop, controls, and buttons
   ===================================================================== */

/* ---------- 0. ERROR REPORTING (shows problems on screen) ---------- */
function showError(msg) {
  const box = document.getElementById("err");
  box.style.display = "block";
  box.textContent = msg;
}
window.addEventListener("error", e => showError("Error: " + e.message + " (line " + e.lineno + ")"));
if (typeof THREE === "undefined") {
  showError("Three.js did not load. Check your internet connection, or turn off any ad blocker or data saver for this page.");
  throw new Error("Three.js missing");
}

/* ---------- 1. SETTINGS & SCENE LIBRARY ---------- */
const TEX = "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/";
const TAU = Math.PI * 2;

// Each entry describes one scene. Add your own planets here later.
const LIBRARY = {
  earth:   { name: "EARTH",   words: ["earth", "globe"],
             palette: [[8,30,95],[20,70,150],[35,115,70],[150,130,85],[245,245,245]],
             atmosphere: 0x4da3ff, clouds: true },
  moon:    { name: "MOON",    words: ["moon", "lunar"],
             palette: [[60,60,62],[120,120,122],[175,175,178],[215,215,218]], tex: "moon_1024.jpg" },
  mars:    { name: "MARS",    words: ["mars", "red planet"],
             palette: [[70,25,14],[150,60,30],[200,110,60],[225,170,120]], atmosphere: 0xff8a5c },
  jupiter: { name: "JUPITER", words: ["jupiter"],
             palette: [[120,80,50],[200,150,100],[235,215,185],[170,105,65]], bands: 9 },
  saturn:  { name: "SATURN",  words: ["saturn", "rings"],
             palette: [[150,125,80],[205,180,125],[232,215,170]], bands: 6, rings: true },
  sun:     { name: "SUN",     words: ["sun"],
             palette: [[150,30,0],[255,110,10],[255,190,60],[255,240,170]], sun: true }
};

/* ---------- 2. PROMPT READER ---------- */
// V1 uses simple keyword matching (no cloud AI needed). It also reads a
// few extra words: "rings" adds rings, "no clouds" removes them.
function readPrompt(text) {
  const t = text.toLowerCase();
  let key = "earth", found = false;
  for (const k in LIBRARY) {
    if (LIBRARY[k].words.some(w => t.includes(w))) { key = k; found = true; break; }
  }
  return {
    key, found,
    rings: LIBRARY[key].rings || t.includes("rings"),
    clouds: LIBRARY[key].clouds && !t.includes("no clouds")
  };
}

/* ---------- 3. PROCEDURAL TEXTURES ---------- */
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) {
  let sum = 0, amp = 0.5;
  for (let i = 0; i < 4; i++) { sum += noise(x, y) * amp; x *= 2; y *= 2; amp *= 0.5; }
  return sum;
}
function pick(palette, n) {            // n from 0 to 1 -> color from palette
  n = Math.min(0.999, Math.max(0, n)) * (palette.length - 1);
  const i = Math.floor(n), f = n - i, a = palette[i], b = palette[i + 1];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
}
function makeTexture(palette, bands) {
  const w = 512, h = 256, c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d"), img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let n = fbm(x / 48, y / 48);
      if (bands) n = 0.5 + 0.45 * Math.sin(y / h * Math.PI * bands + n * 4) * (0.6 + n * 0.5);
      const col = pick(palette, n), i = (y * w + x) * 4;
      img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
}
function loadTexture(file, onOk) {      // tries the photo texture; fails quietly
  new THREE.TextureLoader().setCrossOrigin("anonymous")
    .load(TEX + file, onOk, undefined, () => console.log("Texture not loaded:", file));
}

/* ---------- 4. THREE.JS SETUP ---------- */
const canvas = document.getElementById("canvas");
const screenEl = document.getElementById("screen");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (err) { showError("WebGL is not available in this browser, so the 3D preview cannot start."); throw err; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 16 / 10, 0.1, 200);

const ambient = new THREE.AmbientLight(0x223355, 0.55);
scene.add(ambient);
const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
sunLight.position.set(5, 2, 4);
scene.add(sunLight);

// Starfield: 1500 points scattered on a big sphere
let stars;
(function addStars() {
  const pos = new Float32Array(1500 * 3);
  for (let i = 0; i < 1500; i++) {
    const r = 80, th = Math.random() * TAU, ph = Math.acos(2 * Math.random() - 1);
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
    pos[i * 3 + 2] = r * Math.cos(ph);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, sizeAttenuation: true }));
  scene.add(stars);
})();

const world = new THREE.Group();        // everything we generate goes in here
scene.add(world);
let body = null, cloudLayer = null;     // parts we animate

function resize() {
  const w = screenEl.clientWidth, h = screenEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(screenEl);
window.addEventListener("resize", resize);

/* ---------- 5. SCENE BUILDERS ---------- */
function clearWorld() {
  while (world.children.length) {
    const o = world.children[0];
    world.remove(o);
    o.traverse(n => {
      if (n.geometry) n.geometry.dispose();
      if (n.material) { if (n.material.map) n.material.map.dispose(); n.material.dispose(); }
    });
  }
  body = cloudLayer = null;
}

function glowMaterial(color) {          // soft blue halo around a planet
  return new THREE.ShaderMaterial({
    uniforms: { c: { value: new THREE.Color(color) } },
    vertexShader: "varying vec3 n; varying vec3 v; void main(){ n=normalize(normalMatrix*normal); vec4 m=modelViewMatrix*vec4(position,1.); v=normalize(-m.xyz); gl_Position=projectionMatrix*m; }",
    fragmentShader: "uniform vec3 c; varying vec3 n; varying vec3 v; void main(){ float i=pow(0.72-dot(n,v),3.); gl_FragColor=vec4(c,1.)*i*1.6; }",
    side: THREE.BackSide, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
  });
}

function glowSprite(size) {             // used for the Sun
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const x = c.getContext("2d"), g = x.createRadialGradient(64, 64, 8, 64, 64, 64);
  g.addColorStop(0, "rgba(255,190,80,.9)"); g.addColorStop(1, "rgba(255,120,20,0)");
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, depthWrite: false }));
  s.scale.set(size, size, 1);
  return s;
}

function buildScene(options) {
  clearWorld();
  const def = LIBRARY[options.key];

  // The planet itself: starts with a procedural texture so it appears instantly
  const mat = def.sun
    ? new THREE.MeshBasicMaterial({ map: makeTexture(def.palette) })
    : new THREE.MeshPhongMaterial({ map: makeTexture(def.palette, def.bands), shininess: 8 });
  body = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), mat);
  world.add(body);

  // Earth and Moon: swap in real photo textures when they finish loading
  if (options.key === "earth") {
    loadTexture("earth_atmos_2048.jpg", t => { mat.map = t; mat.needsUpdate = true; });
    loadTexture("earth_normal_2048.jpg", t => { mat.normalMap = t; mat.normalScale.set(0.8, 0.8); mat.needsUpdate = true; });
    loadTexture("earth_specular_2048.jpg", t => { mat.specularMap = t; mat.specular = new THREE.Color(0x444444); mat.shininess = 18; mat.needsUpdate = true; });
  }
  if (def.tex) loadTexture(def.tex, t => { mat.map = t; mat.needsUpdate = true; });

  if (def.atmosphere) {
    const halo = new THREE.Mesh(new THREE.SphereGeometry(1.14, 64, 48), glowMaterial(def.atmosphere));
    world.add(halo);
  }
  if (options.clouds) {
    const cm = new THREE.MeshPhongMaterial({ transparent: true, opacity: 0.55, depthWrite: false, color: 0xffffff });
    cloudLayer = new THREE.Mesh(new THREE.SphereGeometry(1.012, 64, 48), cm);
    cm.map = makeTexture([[0,0,0],[60,60,60],[255,255,255]]);      // soft fallback clouds
    cm.alphaMap = cm.map;
    loadTexture("earth_clouds_1024.png", t => { cm.map = t; cm.alphaMap = null; cm.needsUpdate = true; });
    world.add(cloudLayer);
  }
  if (options.rings) {
    const geo = new THREE.RingGeometry(1.35, 2.3, 128), p = geo.attributes.position, uv = geo.attributes.uv;
    for (let i = 0; i < p.count; i++) {           // make UVs run from inner to outer edge
      const r = Math.hypot(p.getX(i), p.getY(i));
      uv.setXY(i, (r - 1.35) / 0.95, 1);
    }
    const c = document.createElement("canvas"); c.width = 256; c.height = 4;
    const x = c.getContext("2d");
    for (let i = 0; i < 256; i++) {
      const a = 0.25 + 0.6 * Math.abs(Math.sin(i * 0.31) * Math.cos(i * 0.07));
      x.fillStyle = "rgba(215,190,145," + a + ")"; x.fillRect(i, 0, 1, 4);
    }
    const ring = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.DoubleSide, transparent: true, depthWrite: false }));
    ring.rotation.x = Math.PI / 2.3;
    ring.userData.keep = true;
    world.add(ring);
  }
  if (def.sun) { world.add(glowSprite(5)); sunLight.intensity = 0; }
  else sunLight.intensity = 1.5;
}

/* ---------- 5B. ENVIRONMENTS (new in V2) ---------- */
let camSpec = { r: 3.6, el: 0.18, look: [0, 0, 0], turns: 0 }, curHF = () => 0, tm = 0, seed = 1, noAnim = false;
const tickers = [], walkers = [];   // tickers = little animation functions run every frame

// Seeded random numbers: the same prompt always builds the same world
function rnd() { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h; }

// Building blocks
const SPH = new THREE.SphereGeometry(1, 10, 8), BOX = new THREE.BoxGeometry(1, 1, 1), CYL = new THREE.CylinderGeometry(0.5, 0.5, 1, 8), CON = new THREE.ConeGeometry(0.5, 1, 8);
const mat = (c, o) => new THREE.MeshStandardMaterial(Object.assign({ color: c, flatShading: true, roughness: 0.9, metalness: 0 }, o));
const mk = (g, c, o) => new THREE.Mesh(g, mat(c, o));
function part(g, geo, c, x, y, z, sx, sy, sz) { const m = mk(geo, c); m.position.set(x, y, z); m.scale.set(sx, sy === undefined ? sx : sy, sz === undefined ? sx : sz); g.add(m); return m; }

function terrain(size, seg, hf, cf) {          // height-map ground with vertex colors
  curHF = hf;
  const g = new THREE.PlaneGeometry(size, size, seg, seg).rotateX(-Math.PI / 2), p = g.attributes.position, col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i), h = hf(x, z); p.setY(i, h); cf(h, x, z, c); col.set([c.r, c.g, c.b], i * 3); }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat(0xffffff, { vertexColors: true })); world.add(m); return m;
}
function spots(n, s, hf, lo, hi) { const a = []; for (let i = 0; i < n * 4 && a.length < n; i++) { const x = R(-s, s), z = R(-s, s), h = hf(x, z); if (h > lo && h < hi) a.push([x, h, z, R(0.7, 1.4)]); } return a; }
function scatter(geo, color, pts, o, k) {       // many copies of one shape (fast)
  const im = new THREE.InstancedMesh(geo, mat(color, o), Math.max(1, pts.length)), d = new THREE.Object3D();
  pts.forEach((p, i) => { d.position.set(p[0], p[1], p[2]); d.scale.setScalar(p[3] * (k || 1)); d.rotation.y = i * 2.4; d.updateMatrix(); im.setMatrixAt(i, d.matrix); });
  im.count = pts.length; world.add(im); return im;
}
function trees(P, k, jg) {
  scatter(new THREE.CylinderGeometry(0.15, 0.22, 1.8, 6).translate(0, 0.9, 0), 0x5a3a22, P, 0, k);
  scatter(jg ? new THREE.SphereGeometry(1.4, 7, 6).translate(0, 3.2, 0) : new THREE.ConeGeometry(1.1, 3.4, 7).translate(0, 3.2, 0), jg ? 0x2f9a3f : 0x24602f, P, 0, k);
  if (!jg) scatter(new THREE.ConeGeometry(0.8, 2.4, 7).translate(0, 4.3, 0), 0x2c7036, P, 0, k);
}
function beams(n, s, color, op) {               // soft light shafts
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(new THREE.ConeGeometry(2.2, 16, 12, 1, true), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
    m.position.set(R(-s, s), 8, R(-s, s)); m.rotation.z = R(-0.2, 0.2); world.add(m);
  }
}
function particles(kind, n, color, size, box, y0) {   // snow, rain, embers, bubbles, dust, fireflies
  const p = new Float32Array(n * 3), H = box * 0.6;
  for (let i = 0; i < n; i++) { p[i * 3] = R(-box, box); p[i * 3 + 1] = R(0, H); p[i * 3 + 2] = R(-box, box); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  const add = kind === "embers" || kind === "fireflies" || kind === "bubbles";
  const pt = new THREE.Points(g, new THREE.PointsMaterial({ color, size, transparent: true, opacity: 0.85, depthWrite: false, blending: add ? THREE.AdditiveBlending : THREE.NormalBlending }));
  pt.position.y = y0 || 0; world.add(pt);
  const vy = { snow: -1.4, rain: -16, embers: 1.8, bubbles: 1, dust: 0, fireflies: 0 }[kind], sw = kind === "rain" ? 0 : kind === "fireflies" ? 1.3 : 0.5;
  tickers.push((dt, t) => {
    for (let i = 0; i < p.length; i += 3) {
      p[i] += Math.sin(t * 0.6 + i) * sw * dt + (kind === "dust" ? dt * 2.5 : 0);
      p[i + 1] += vy * dt + (kind === "fireflies" ? Math.sin(t * 1.5 + i) * 0.4 * dt : 0);
      p[i + 2] += Math.cos(t * 0.5 + i) * sw * dt;
      if (p[i + 1] > H) p[i + 1] -= H; else if (p[i + 1] < 0) p[i + 1] += H;
      if (p[i] > box) p[i] -= 2 * box;
    }
    g.attributes.position.needsUpdate = true;
  });

/* --- Prompt router: counts keywords for each environment and picks the best --- */
const ENVS = {
  ancient:  { re: "castles?|ancient|pyramids?|temples?|ruins?|medieval|kingdom|fortress|rom(?:e|an)|egypt\\w*|greek|civili[sz]ation|palace|knights?|acropolis|colosseum|citadel|aztec|mayan?|viking|samurai|empire|gladiator|pharaoh|sphinx|stronghold|battlements?", fn: envAncient },
  forest:   { re: "forests?|jungles?|trees?|woods?|woodland|rainforest|pines?|tropical|enchanted|bamboo|swamp|grove|garden|amazon|redwood|oaks?|mushrooms?|fairy|lush|nature", fn: envForest },
  ocean:    { re: "oceans?|seas?|underwater|reefs?|whales?|fish|coral|sharks?|dolphins?|deep sea|waves|diver|submarine|beach|island|lagoon|harbou?r|pirates?|ships?|boats?|sail\\w*|tsunami|jellyfish|turtles?|octopus|atlantis|aquarium|kraken|seabed|water(?!fall)\\w*", fn: envOcean },
  volcano:  { re: "volcan\\w*|lava|eruption|erupting|magma|deserts?|dunes?|sahara|sand\\w*|cactus|cacti|canyon|arid|wasteland|badlands|oasis|camels?|molten|geysers?", fn: envVolcano },
  city:     { re: "cit(?:y|ies)|futuristic|cyber\\w*|neon|skyscrapers?|sci-?fi|future|metropolis|downtown|urban|tokyo|streets?|buildings?|dystopi\\w+|spaceport|highway|megacity", fn: envCity },
  mountain: { re: "mountains?|landscape|hills?|alps|snow\\w*|valley|peaks?|glacier|himalaya\\w*|cliffs?|highlands?|lake|everest|fuji|rocky|tundra|arctic|antarctic|icebergs?|ice\\b|winter|plateau|waterfalls?|scenery", fn: envMountain },
  dino:     { re: "dinosaurs?|prehistoric|jurassic|t-?rex|tyrannosaur\\w*|raptors?|triceratops|brachio\\w*|cretaceous|sauropod|dino\\w*|pterodactyls?|pterosaurs?|stegosaur\\w*|mammoths?|ice age|caveman|stone age|primeval|fossils?|spinosaur\\w*", fn: envDino },
  animals:  { re: "animals?|creatures?|wolf|wolves|dogs?|cats?|lions?|tigers?|deer|horses?|elephants?|bears?|foxes|fox|cows?|sheep|birds?|eagles?|owls?|hawks?|dragons?|monsters?|beasts?|wyverns?|safari|herd|wildlife|monkeys?|gorillas?|giraffes?|zebras?|rhinos?|hippos?|leopards?|panthers?|cheetahs?|pandas?|rabbits?|bunny|ducks?|geese|swans?|parrots?|seagulls?|pigs?|goats?|unicorns?|griffin|phoenix|pegasus|meadow|savann?ah|plains|grassland|farm|zoo|pets?|countryside|fields?", fn: envWild },
  space:    { re: "space|planets?|galax\\w+|nebula\\w*|stars?|cosmos|universe|asteroids?|earth|moon|mars|jupiter|saturn|sun|solar|lunar|rings", fn: envGalaxy },
  abstract: { re: "abstract|energy|fractal|geometric|glowing|portal|dream\\w*|surreal|particles|psychedelic|kaleidoscope|hologram|vortex|swirl|shapes?|magic\\w*|aurora|mystic\\w*|plasma|lightning|electric|colou?rful|rainbow|cosmic", fn: envAbstract }
};

function mood(m) {
  scene.background = new THREE.Color(m.sky); scene.fog = new THREE.FogExp2(m.fog !== undefined ? m.fog : m.sky, m.fd);
  sunLight.color.set(m.sun); sunLight.intensity = m.si; sunLight.position.set(...(m.sp || [5, 8, 4]));
  ambient.color.set(m.amb); ambient.intensity = m.ai;
}
function tune(m, t) {                            // time-of-day and weather words
  m = Object.assign({}, m);
  if (/\b(night|midnight|moonlit|dark|starry)\b/.test(t)) Object.assign(m, { sky: 0x070b1c, fog: 0x0a1030, sun: 0x6f8cff, si: 0.6, amb: 0x24346e, ai: 0.9 });
  else if (/\b(sunset|sunrise|dawn|dusk|golden)\b/.test(t)) Object.assign(m, { sky: 0xf0894b, fog: 0xf0a070, sun: 0xff9a55, si: 1.6, sp: [-9, 3, 6], amb: 0x8a5a6a, ai: 0.8 });
  if (/\b(fog|foggy|mist|misty|haze|hazy)\b/.test(t)) { m.fd *= 2.5; m.fog = m.sky; }
  if (/\b(storm\w*|rain\w*)\b/.test(t)) Object.assign(m, { sky: 0x4a525e, fog: 0x4a525e, si: 0.5, amb: 0x6a7482, ai: 0.8, fd: m.fd * 2 });
  return m;
}

const STOP = /^(with|and|over|under|near|from|into|that|this|its|for|very|some|many|scene|video|cinematic|realistic|beautiful|epic|amazing|camera|view|show|make|create|generate|rotating|flying|walking|floating|standing|giant|slowly|around|above|below|behind|front|there|their|where|while|during|across|through|style|like|looking|full|wide|shot|time|world|land|place|area|large|small|huge|tiny|inside|outside|surrounded|lots|surface)$/;
let KNOWN;
function buildAny(text) {
  const t = text.toLowerCase(); seed = hashStr(t); noAnim = false;
  clearWorld(); tickers.length = 0; walkers.length = 0; curHF = () => 0;
  scene.fog = null; scene.background = null; stars.visible = true;
  ambient.color.set(0x223355); ambient.intensity = 0.55; sunLight.color.set(0xffffff); sunLight.intensity = 1.5; sunLight.position.set(5, 2, 4);
  let best = "abstract", top = 0;
  for (const k in ENVS) { const n = (t.match(new RegExp("\\b(?:" + ENVS[k].re + ")" + (k === "space" ? "\\b" : ""), "g")) || []).length; if (n > top) { top = n; best = k; } }
  const propHit = PROPS.some(p => p[0].test(t));
  if (!top && propHit) { best = /rocket|spaceship|spacecraft|shuttle|ufo|alien|saucer/.test(t) ? "space" : /ship|boat|pirate|lighthouse|sail/.test(t) ? "ocean" : "animals"; noAnim = best === "animals"; }
  const planet = readPrompt(t), isPlanet = best === "space" && planet.found;
  let label, cam;
  if (isPlanet) {                                 // real planets (Earth, Moon, Mars, Jupiter, Saturn, Sun)
    buildScene(planet); cam = { r: 3.6, el: 0.18, look: [0, 0, 0], turns: 0 }; label = LIBRARY[planet.key].name;
  } else {
    const r = ENVS[best].fn(t); cam = r.cam; label = r.label; mood(tune(r.m, t));
    stars.visible = (best === "space" || best === "abstract");
  }
  camSpec = cam;
  if (!isPlanet) addProps(t, cam, best);
  const box = Math.max(30, cam.r * 0.8);
  if (/\bsnow/.test(t)) particles("snow", 900, 0xffffff, 0.14, box);
  if (/\b(rain\w*|storm\w*)\b/.test(t)) particles("rain", 1100, 0xaecbff, 0.07, box);
  if (!["animals", "dino", "abstract", "space", "ocean"].includes(best) && (A.some(a => a[0].test(t)) || FLY.test(t) || DRAG.test(t) || /\b(animals?|wildlife)\b/.test(t))) spawnAnimals(t);
  if (walkers.length) tickers.push(walkTick);
  if (!KNOWN) KNOWN = new RegExp("^(?:" + [...Object.values(ENVS).map(e => e.re), ...PROPS.map(p => p[0].source), ...A.map(a => a[0].source), FLY.source, DRAG.source, "night|midnight|moonlit|dark|starry|sunset|sunrise|dawn|dusk|golden|fog\\w*|mist\\w*|haz\\w+|storm\\w*|rain\\w*|snow\\w*|" + Object.keys(HUES).join("|")].join("|") + ")$");
  const unk = [...new Set((t.match(/[a-z]+/g) || []).filter(w => w.length > 3 && !STOP.test(w) && !KNOWN.test(w)))].slice(0, 4);
  const ok = top || propHit;
  return { label, note: (ok ? "Scene ready: " + label.toLowerCase() + ". Drag the preview to look around." : "I found no scene keywords, so I made an abstract scene.") + (unk.length ? " Words I don't know yet: " + unk.join(", ") + "." : "") };
}

/* ---------- 6. ANIMATION, CONTROLS, BUTTONS ---------- */
const byId = id => document.getElementById(id);
let playing = true;
let duration = 20;      // seconds for one full cinematic loop
let progress = 0;       // 0 to 1 through the loop
let yawOffset = 0, pitch = 0.18;   // changed by dragging
let lastTime = performance.now();

function fmt(s) { s = Math.floor(s); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  if (playing) { progress = (progress + dt / duration) % 1; tm += dt; tickers.forEach(f => f(dt, tm, progress)); }

  // Planets spin; clouds drift a little faster
  if (body) body.rotation.y = progress * TAU;
  if (cloudLayer) cloudLayer.rotation.y = progress * TAU * 1.15;

  // Cinematic camera: orbit (or sway) around the scene, with a gentle push-in and pull-out
  const C = camSpec, ph = progress * TAU;
  const yaw = yawOffset + (C.turns ? ph * C.turns : Math.sin(ph) * 0.3);
  const el = Math.max(0.04, C.el + pitch - 0.18), dist = C.r * (1 + 0.08 * Math.sin(ph));
  camera.position.set(C.look[0] + Math.sin(yaw) * Math.cos(el) * dist, C.look[1] + Math.sin(el) * dist, C.look[2] + Math.cos(yaw) * Math.cos(el) * dist);
  camera.lookAt(C.look[0], C.look[1], C.look[2]);

  renderer.render(scene, camera);
  byId("progressFill").style.width = (progress * 100) + "%";
  byId("timecode").textContent = fmt(progress * duration) + " / " + fmt(duration);
}

// Play / Pause
byId("playBtn").addEventListener("click", () => {
  playing = !playing;
  byId("playBtn").textContent = playing ? "Pause" : "Play";
});

// Duration slider
byId("duration").addEventListener("input", e => {
  duration = Number(e.target.value);
  byId("durationLabel").textContent = duration + " s";
});

// Drag to look around (works with touch and mouse)
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  yawOffset -= (e.clientX - lx) * 0.006;
  pitch = Math.max(-1.1, Math.min(1.1, pitch + (e.clientY - ly) * 0.006));
  lx = e.clientX; ly = e.clientY;
});
["pointerup", "pointercancel"].forEach(ev => canvas.addEventListener(ev, () => { dragging = false; }));

// Generate Scene
function generate() {
  byId("overlay").classList.add("on"); byId("generateBtn").disabled = true;
  setTimeout(() => {                    // short pause so the overlay can appear
    try {
      const r = buildAny(byId("prompt").value);
      progress = 0; yawOffset = 0; pitch = 0.18;
      byId("sceneName").textContent = r.label;
      byId("status").textContent = r.note;
    } catch (err) { showError("Scene error: " + err.message); }
    byId("overlay").classList.remove("on"); byId("generateBtn").disabled = false;
  }, 350);
}
byId("generateBtn").addEventListener("click", generate);

// Example chips fill the prompt and generate right away
byId("chips").addEventListener("click", e => {
  if (!e.target.classList.contains("chip")) return;
  byId("prompt").value = e.target.textContent;
  generate();
});

// Start
resize();
buildAny(byId("prompt").value);
requestAnimationFrame(frame);
</script>

</body>
